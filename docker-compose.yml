services:
  postgres:
    image: postgres:17-alpine
    container_name: psy2bib-postgres
    environment:
      POSTGRES_USER: psy2bib
      POSTGRES_PASSWORD: psy2bib
      POSTGRES_DB: psy2bib
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - psy2bib-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psy2bib"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: psy2bib-backend:dev
    container_name: psy2bib-backend
    env_file:
      - .env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - psy2bib-network

volumes:
  postgres-data:

networks:
  psy2bib-network:
    driver: bridge
